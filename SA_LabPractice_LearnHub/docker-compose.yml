services:
  postgres:
    image: postgres:16-alpine
    container_name: learnhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: learnhub
      POSTGRES_USER: learnhub
      POSTGRES_PASSWORD: learnhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
